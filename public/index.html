<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b0b0c" />
<title>Circles — Social Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app" id="app">
  <!-- LOGIN -->
  <div id="login">
    <svg class="logo venn" width="84" height="64" viewBox="0 0 84 64">
      <circle cx="30" cy="32" r="22" stroke-width="3.2"/>
      <circle cx="54" cy="32" r="22" stroke-width="3.2"/>
    </svg>
    <h1>Circles</h1>
    <p class="sub">Share what you're listening to with the people who get it. Public, or just your circles.</p>
    <a class="btn-spotify" href="/auth/login">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.59 14.42a.62.62 0 01-.86.21c-2.35-1.44-5.3-1.76-8.79-.97a.625.625 0 11-.28-1.22c3.81-.87 7.08-.5 9.72 1.12.3.18.39.57.21.86zm1.22-2.72a.78.78 0 01-1.07.26c-2.69-1.65-6.79-2.13-9.97-1.17a.78.78 0 11-.45-1.49c3.64-1.1 8.16-.56 11.24 1.33.37.22.49.7.25 1.07zm.11-2.84c-3.23-1.92-8.55-2.1-11.63-1.16a.935.935 0 11-.54-1.79c3.54-1.07 9.42-.86 13.13 1.34a.936.936 0 01-.96 1.61z"/></svg>
      Connect with Spotify
    </a>
    <div class="login-foot">An original social-listening app — not affiliated with Spotify. Signing in uses Spotify only to read your account and listening data.</div>
    <div class="login-err" id="login-err"></div>
  </div>

  <!-- MAIN -->
  <div id="main" class="hidden">
    <div class="scroll" id="scroll"><div id="view"></div></div>

    <div class="nowbar hidden" id="nowbar">
      <div class="art" id="now-art" style="width:42px;height:42px;border-radius:9px;"></div>
      <div class="ti"><div class="t" id="now-t"></div><div class="a" id="now-a"></div></div>
      <button class="icon-btn" id="now-toggle" title="Play / pause">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="icon-btn" id="now-share" title="Share this">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>

    <div class="tabbar">
      <div class="tabs">
        <button class="tab" data-tab="home">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg>
          <span class="lbl">Home</span>
        </button>
        <button class="tab" data-tab="circles">
          <span class="nbadge hidden" id="nav-badge"></span>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="8.5" cy="10" r="5"/><circle cx="15.5" cy="14" r="5"/></svg>
          <span class="lbl">Circles</span>
        </button>
        <button class="fab" id="fab">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="tab" data-tab="search">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <span class="lbl">Search</span>
        </button>
        <button class="tab" data-tab="library">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          <span class="lbl">Library</span>
        </button>
      </div>
    </div>
  </div>

  <div id="overlay"></div>
  <div id="toast-host"></div>
</div>
<script>
  // Define the SDK ready hook BEFORE the SDK script loads.
  window.__sdkReady = false;
  window.onSpotifyWebPlaybackSDKReady = function(){ window.__sdkReady = true; if (window.onSDKReady) window.onSDKReady(); };
</script>
<script src="https://sdk.scdn.co/spotify-player.js"></script>
<script src="/app.js"></script>
</body>
</html>
